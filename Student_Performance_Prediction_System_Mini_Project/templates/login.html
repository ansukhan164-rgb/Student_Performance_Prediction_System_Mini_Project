{% extends 'base.html' %}

{% block title %}Login - Ansar Student Performance AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg p-4 rounded-4">
        <div class="text-center mb-4">
          <h3 class="fw-extrabold">Welcome Back</h3>
          <p class="text-muted small">Sign in using your University Register UID & Password</p>
        </div>

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">University Register UID</label>
            {{ form.username }}
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            {{ form.password }}
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold rounded-pill shadow-sm">
            Sign In
          </button>
        </form>

        <div class="text-center mt-4">
          <p class="text-muted small">Don't have an account? <a href="{% url 'signup' %}" class="fw-bold text-decoration-none">Register Here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
